<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f1">
<title>配布図鑑 - GoHOME cherish</title>
<style>
:root{
  --bg:#f5f4f1;
  --bg-rgb:245,244,241;
  --surface:#fbfaf7;
  --surface2:#efeeea;
  --text:#323437;
  --muted:#777b7f;
  --faint:#a5a8aa;
  --line:#deddd8;
  --line2:#e8e7e2;
  --accent:#627f91;
  --accent-soft:#e8eff3;
  --rose:#a96f7c;
  --rose-soft:#f3e8eb;
  --danger:#a66b6b;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#1c1d1f;
  --bg-rgb:28,29,31;
  --surface:#26282b;
  --surface2:#2e3033;
  --text:#eceded;
  --muted:#a3a7ab;
  --faint:#787c80;
  --line:#3c3e41;
  --line2:#333537;
  --accent:#8fb2c7;
  --accent-soft:#2c3a42;
  --rose:#d99cab;
  --rose-soft:#3a2c31;
  --danger:#e08b7a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button,label{touch-action:manipulation}

.topbar{
  position:sticky;top:0;z-index:30;height:52px;
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  padding-top:env(safe-area-inset-top);
  background:rgba(var(--bg-rgb),.96);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top-action{
  width:36px;height:36px;margin:auto;border:0;background:transparent;
  display:grid;place-items:center;font-size:18px;border-radius:8px;text-decoration:none;color:inherit
}
.top-action:active{background:var(--surface2)}
.brand{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;font-weight:650}
.main{max-width:560px;margin:0 auto;padding:14px 14px 60px}

.note-box{
  font-size:9.5px;color:var(--faint);background:var(--surface2);border-radius:8px;padding:9px 11px;
  margin-bottom:14px;line-height:1.7
}

.search-box{margin-bottom:10px}
.search-box input{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;background:var(--surface)
}

.filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.filter-chip{
  flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;
  padding:7px 13px;font-size:11px;color:var(--muted);white-space:nowrap
}
.filter-chip.on{background:var(--accent-soft);border-color:#c9d9e1;color:#3f5a6b;font-weight:650}

.result-count{font-size:9.5px;color:var(--faint);margin:2px 2px 8px}

/* ===== 配布図鑑アイテム(パターンC) ===== */
.distItem{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
.distItem.highlight{
  border-color:#8da7b6;
  box-shadow:inset 3px 0 0 #8da7b6,0 0 0 1px #8da7b6;
}
.focusbar{
  display:none;align-items:center;justify-content:space-between;
  border-left:3px solid #8da7b6;background:var(--accent-soft);
  margin:0 0 7px;padding:7px 9px;font-size:10px;color:#4e6877
}
.focusbar.show{display:flex}
.focusbar button{border:0;background:transparent;color:inherit}
.distRow{padding:10px 12px 2px}
.distName{font-size:13.5px;font-weight:700}
.distName .indiv-idx-badge{font-size:11px;color:var(--rose);font-weight:700;margin-left:2px}
.distName .paren{
  display:inline-block;margin-left:6px;font-size:10px;font-weight:600;color:var(--rose);
  background:var(--rose-soft);border-radius:5px;padding:1px 7px
}
.distGames{font-size:9px;color:var(--faint);margin-top:3px}
.distIcons{display:flex;align-items:center;gap:1px;padding:6px 6px 7px}
.iconBtn{
  flex:1;height:32px;border:0;background:transparent;border-radius:7px;
  display:grid;place-items:center;font-size:13.5px
}
.indiv-add-btn{
  flex:none;width:22px;height:32px;border:1px dashed var(--line);background:var(--surface2);
  border-radius:7px;font-size:11px;color:var(--accent);display:grid;place-items:center
}
.indiv-delete-btn{
  flex:none;width:22px;height:32px;border:1px dashed var(--line);background:var(--surface2);
  border-radius:7px;font-size:11px;color:var(--danger);display:grid;place-items:center
}
.iconBtn.off{opacity:.3;filter:grayscale(1)}
.expandBtn{
  flex:none;width:30px;height:32px;border:1px solid var(--line);background:var(--surface2);
  border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--accent)
}

.rom-chip-row{display:flex;flex-wrap:wrap;gap:5px;padding:0 8px 9px}
.rom-chip{
  border:1px solid var(--line);background:var(--surface2);border-radius:12px;
  padding:5px 11px;font-size:10px;color:var(--muted)
}
.rom-chip.on{background:var(--accent-soft);border-color:#c9d9e1;color:#3f5a6b;font-weight:650}
.rom-chip-empty{font-size:9.5px;color:var(--faint);padding:5px 2px}

.distDetail{display:none;border-top:1px solid var(--line2);padding:12px;background:var(--surface2)}
.distItem.open .distDetail{display:block}
.distDetail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:10.5px;margin-bottom:10px}
.distDetail-grid .row{display:flex;flex-direction:column;gap:2px}
.distDetail-grid .row .k{color:var(--faint);font-size:9px}
.distDetail-grid .row .v{font-weight:600}
.distDetail-grid .row.full{grid-column:1/-1}
.distDetail-notes{font-size:9.5px;color:var(--muted);line-height:1.7;background:var(--surface);border-radius:7px;padding:8px 9px;margin-bottom:8px}
.distDetail-source{font-size:9px}
.distDetail-source a{color:var(--accent);word-break:break-all}

.empty-note{text-align:center;padding:40px 20px;color:var(--faint);font-size:11px;line-height:1.8}

/* ===== 右端ミニスクロールバー ===== */
.mini-scrollbar{
  position:fixed;top:0;right:0;bottom:0;width:26px;z-index:60;
  display:none;
  pointer-events:none;
}
.mini-scrollbar.show{display:block}
.mini-scrollbar-track{
  position:absolute;top:60px;bottom:60px;right:8px;width:4px;
  background:var(--line2);border-radius:3px;
  opacity:0;transition:opacity .2s ease;
  pointer-events:none;
}
.mini-scrollbar.scrolling .mini-scrollbar-track,
.mini-scrollbar.dragging .mini-scrollbar-track{opacity:1}
.mini-scrollbar-thumb{
  position:absolute;right:5px;width:10px;height:32px;
  background:var(--accent);border-radius:5px;opacity:0;
  transition:opacity .2s ease, width .15s ease, right .15s ease, height .15s ease;
  pointer-events:auto;
  touch-action:none;
}
.mini-scrollbar.scrolling .mini-scrollbar-thumb{opacity:.5}
.mini-scrollbar.dragging .mini-scrollbar-thumb{
  opacity:.9; width:20px; right:2px; height:44px;
}
.mini-scrollbar-badge{
  position:absolute;right:26px;transform:translateY(-50%);
  background:var(--text);color:#fff;font-size:10px;font-family:var(--mono);
  padding:4px 8px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s
}
.mini-scrollbar.dragging .mini-scrollbar-badge{opacity:1}
.toast{
  position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:100;transform:translateX(-50%);
  background:#35383a;color:#fff;padding:8px 12px;border-radius:8px;font-size:10px;display:none
}
.toast.show{display:block}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="top-action" id="back-to-index" aria-label="図鑑にもどる">‹</a>
  <div class="brand">配布図鑑</div>
  <span></span>
</header>

<main class="main">

  <div class="note-box">💡 過去に公式から配布された特別なポケモンの一覧です。💌は「ふしぎなおくりもの」のカードデータを保存しているか、🤝は実際に受け取り済みかを記録できます。データは自動保存されます。</div>

  <div class="search-box"><input id="dist-search" placeholder="ポケモン名・配布名で検索"></div>

  <div class="filter-chips" id="game-filter-chips">
    <button class="filter-chip on" data-game="all">すべてのソフト</button>
  </div>

  <div class="filter-chips" id="status-filter-chips">
    <button class="filter-chip on" data-status="all">すべて</button>
    <button class="filter-chip" data-status="favorite">🩷 お気に入り</button>
    <button class="filter-chip" data-status="owned">✅ 所持</button>
    <button class="filter-chip" data-status="shiny">✨ 色違い</button>
    <button class="filter-chip" data-status="home">🏠 HOME対象</button>
    <button class="filter-chip" data-status="received">🤝 受取済み</button>
    <button class="filter-chip" data-status="card">💌 カードあり</button>
  </div>

  <div class="result-count" id="dist-count"></div>

  <div class="focusbar" id="focusbar"><span id="focus-label">🔍 表示中</span><button id="clear-focus">×</button></div>

  <div id="dist-list"></div>

</main>

<div class="toast" id="toast"></div>

<div id="mini-scrollbar" class="mini-scrollbar">
  <div class="mini-scrollbar-track"></div>
  <div class="mini-scrollbar-thumb" id="mini-scrollbar-thumb"></div>
  <div class="mini-scrollbar-badge" id="mini-scrollbar-badge"></div>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

  // ===== 一時的なデバッグログ(不具合調査用) =====
  function dlog(){ /* デバッグログ機構は削除済み(no-op) */ }

  // ユーザー入力・インポート由来の値をHTML文字列に埋め込む際に使う、最低限のエスケープ
  function escapeHtml(v){
    return String(v==null ? '' : v)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1500)}
  $('#clear-focus').onclick=()=>{$$('.distItem').forEach(x=>x.classList.remove('highlight'));$('#focusbar').classList.remove('show')};


  // ===== IndexedDB (index.html/playthrough.htmlと共有) =====
  const DB_NAME = 'gohome_cherish_db';
  const DB_VERSION = 1;
  const STORE_NAME = 'kv';
  let dbPromise = null;
  let dbInstance = null;

  function openDb(){
    if(dbInstance) return Promise.resolve(dbInstance);
    if(dbPromise) return dbPromise;

    const openingPromise = new Promise((resolve, reject)=>{
      if(!window.indexedDB){
        reject(new Error('IndexedDB非対応のブラウザです'));
        return;
      }

      let settled = false;
      const timeoutId = setTimeout(()=>{
        if(settled) return;
        settled = true;
        dlog('openDb: タイムアウト(3000ms)。接続要求を待ち続けず失敗扱いにします。');
        reject(new Error('IndexedDB接続がタイムアウトしました'));
      }, 3000);

      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE_NAME)){
          db.createObjectStore(STORE_NAME);
        }
      };
      req.onsuccess = (e)=>{
        const db = e.target.result;
        // タイムアウト後に遅れて成功した接続は、幽霊接続として残さず即座に閉じる。
        if(settled){
          try{ db.close(); }catch(_){}
          return;
        }
        settled = true;
        clearTimeout(timeoutId);
        dbInstance = db;
        db.onversionchange = ()=>{
          dlog('IndexedDB versionchange受信 → 接続を閉じます');
          try{ db.close(); }catch(_){}
          if(dbInstance === db) dbInstance = null;
          dbPromise = null;
        };
        resolve(db);
      };
      req.onerror = (e)=>{
        if(settled) return;
        settled = true;
        clearTimeout(timeoutId);
        reject(e.target.error || new Error('IndexedDB open error'));
      };
      req.onblocked = ()=>{
        // blocked は通常の同一バージョン接続ではなく、versionchange が他接続に阻まれた時に起こる。
        dlog('openDb: onblocked発火(versionchange待ち)。タイムアウトで復帰します。');
      };
    });

    dbPromise = openingPromise;
    openingPromise.catch(()=>{
      if(dbPromise === openingPromise) dbPromise = null;
    });
    return openingPromise;
  }

  // SafariでIDBTransactionが無反応のまま残っても、画面操作全体を永久停止させない。
  function runIdbTransaction(db, mode, label, operation, timeoutMs=1800){
    return new Promise((resolve, reject)=>{
      let settled = false;
      let tx = null;
      let timer = null;

      const finishOk = ()=>{
        if(settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(true);
      };
      const finishError = (err)=>{
        if(settled) return;
        settled = true;
        clearTimeout(timer);
        reject(err instanceof Error ? err : new Error(String(err || 'IndexedDB transaction error')));
      };

      try{
        tx = db.transaction(STORE_NAME, mode);
        tx.oncomplete = finishOk;
        tx.onerror = (e)=> finishError(tx.error || e.target.error || new Error(`IndexedDB transaction error: ${label}`));
        tx.onabort = ()=> finishError(tx.error || new Error(`IndexedDB transaction aborted: ${label}`));
        operation(tx.objectStore(STORE_NAME));
        timer = setTimeout(()=>{
          if(settled) return;
          dlog(`IDB transaction timeout: ${label}`);
          try{ tx.abort(); }catch(_){}
          finishError(new Error(`IndexedDB transaction timeout: ${label}`));
        }, timeoutMs);
      }catch(err){
        finishError(err);
      }
    });
  }

  function closeDbConnection(){
    const db = dbInstance;
    dbInstance = null;
    dbPromise = null;
    if(db){
      try{ db.close(); }catch(_){}
    }
  }

  async function idbSet(key, value){
    try{
      const db = await openDb();
      await runIdbTransaction(db, 'readwrite', `put:${key}`, (store)=>{
        store.put(value, key);
      });
      return true;
    }catch(err){
      console.error('idbSet失敗', key, err);
      dlog(`idbSet失敗: key=${key} error=${err && err.message}`);
      return false;
    }
  }

  async function idbGet(key){
    try{
      const db = await openDb();
      let result;
      await runIdbTransaction(db, 'readonly', `get:${key}`, (store)=>{
        const req = store.get(key);
        req.onsuccess = ()=>{ result = req.result; };
      });
      return result;
    }catch(err){
      console.error('idbGet失敗', key, err);
      dlog(`idbGet失敗: key=${key} error=${err && err.message}`);
      return undefined;
    }
  }

  function debounce(fn, wait){
    let timer=null;
    return (...args)=>{ clearTimeout(timer); timer=setTimeout(()=>fn(...args), wait); };
  }

  const GAME_ID_MAP = {
    'ダイヤモンド':'diamond','パール':'pearl','プラチナ':'platinum',
    'ハートゴールド':'heartgold','ソウルシルバー':'soulsilver',
    'ブラック':'black','ホワイト':'white','ブラック2':'black2','ホワイト2':'white2',
    'X':'x','Y':'y','オメガルビー':'omega-ruby','アルファサファイア':'alpha-sapphire',
    'サン':'sun','ムーン':'moon','ウルトラサン':'ultra-sun','ウルトラムーン':'ultra-moon'
  };
  let allRoms = []; // 登録済みROM一覧([{romId, name, base, active}, ...])

  // その配布ポケモンが対応しているソフトに、実際に登録されているROMだけを抽出する
  function getCompatibleRoms(compatibleGames){
    return allRoms.filter(rom=>{
      const gameId = GAME_ID_MAP[rom.base];
      return gameId && compatibleGames.includes(gameId);
    });
  }

  const GAME_LABELS = {
    diamond:'ダイヤモンド', pearl:'パール', platinum:'プラチナ',
    heartgold:'ハートゴールド', soulsilver:'ソウルシルバー',
    black:'ブラック', white:'ホワイト', black2:'ブラック2', white2:'ホワイト2',
    x:'X', y:'Y', 'omega-ruby':'オメガルビー', 'alpha-sapphire':'アルファサファイア',
    sun:'サン', moon:'ムーン', 'ultra-sun':'ウルトラサン', 'ultra-moon':'ウルトラムーン'
  };
  const GROUP_LABELS = [
    {games:['diamond','pearl','platinum','heartgold','soulsilver'], label:'DP/Pt/HGSS'},
    {games:['black','white','black2','white2'], label:'BW/BW2'},
    {games:['x','y','omega-ruby','alpha-sapphire'], label:'XY/ORAS'},
    {games:['sun','moon','ultra-sun','ultra-moon'], label:'SM/USUM'},
  ];
  function groupLabelFor(compatibleGames){
    const found = GROUP_LABELS.find(g => g.games.some(x=>compatibleGames.includes(x)));
    return found ? found.label : compatibleGames.map(g=>GAME_LABELS[g]||g).join('・');
  }

  let allEvents = [];
  let eventState = {}; // eventId -> {received:bool, hasCard:bool}
  let currentGameFilter = 'all';
  let currentStatusFilter = 'all';
  let searchQuery = '';

  async function loadEvents(){
    dlog('loadEvents開始: fetch(data/distribution_events.json)');
    try{
      const res = await fetch('data/distribution_events.json');
      dlog(`fetch結果: status=${res.status} ok=${res.ok}`);
      if(!res.ok) throw new Error('fetch failed: '+res.status);
      allEvents = await res.json();
      dlog(`JSON parse成功: ${allEvents.length}件`);
    }catch(err){
      dlog(`loadEvents失敗: ${err.message}`);
      $('#dist-list').innerHTML = '<div class="empty-note">配布データを読み込めませんでした。<br>data/distribution_events.json の設置状況をご確認ください。</div>';
      return;
    }
    const saved = await idbGet('distributionState');
    eventState = saved || {};
    allRoms = (await idbGet('romList')) || [];
    buildGameFilterChips();
    renderList();
    jumpToEventFromUrl();
  }

  // 横断検索(index.html)から eventId 付きで遷移してきた場合、該当の配布ポケモンを開いてハイライトする
  function jumpToEventFromUrl(){
    const params = new URLSearchParams(location.search);
    const eventId = params.get('eventId');
    if(!eventId) return;
    const ev = allEvents.find(e=>e.eventId===eventId);
    if(!ev){
      toast('該当の配布ポケモンが見つかりませんでした');
      return;
    }
    // フィルターで隠れていると探せないので、一旦「すべて」に戻してから対象を探す
    currentGameFilter = 'all';
    currentStatusFilter = 'all';
    searchQuery = '';
    $('#dist-search').value = '';
    $$('#game-filter-chips .filter-chip').forEach(c=>c.classList.toggle('on', c.dataset.group==='all'));
    $$('#status-filter-chips .filter-chip').forEach(c=>c.classList.toggle('on', c.dataset.status==='all'));
    renderList();
    const target = $(`.distItem[data-event-id="${eventId}"]`);
    if(target){
      target.classList.add('open');
      target.classList.add('highlight');
      $('#focus-label').textContent = '🔍 '+ev.nameJa+' を表示中';
      $('#focusbar').classList.add('show');
      setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center'}), 80);
    }
  }

  function buildGameFilterChips(){
    const wrap = $('#game-filter-chips');
    const usedGroups = new Set();
    allEvents.forEach(e=> usedGroups.add(groupLabelFor(e.compatibleGames)));
    const groupsInOrder = GROUP_LABELS.map(g=>g.label).filter(l=>usedGroups.has(l));
    wrap.innerHTML = '<button class="filter-chip on" data-group="all">すべてのソフト</button>' +
      groupsInOrder.map(label=>`<button class="filter-chip" data-group="${label}">${label}</button>`).join('');
    wrap.querySelectorAll('.filter-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        wrap.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('on'));
        chip.classList.add('on');
        currentGameFilter = chip.dataset.group;
        renderList();
      });
    });
  }

  $('#status-filter-chips').addEventListener('click', (e)=>{
    const chip = e.target.closest('.filter-chip');
    if(!chip) return;
    $$('#status-filter-chips .filter-chip').forEach(c=>c.classList.remove('on'));
    chip.classList.add('on');
    currentStatusFilter = chip.dataset.status;
    renderList();
  });

  $('#dist-search').addEventListener('input', (e)=>{
    searchQuery = e.target.value.trim();
    renderList();
  });

  function matchesFilters(e){
    if(currentGameFilter!=='all' && groupLabelFor(e.compatibleGames)!==currentGameFilter) return false;
    let stArr = eventState[e.eventId] || [{}];
    if(!Array.isArray(stArr)) stArr = [stArr];
    if(!stArr.length) stArr = [{}];
    // 複数個体のうち、いずれか1つでも条件を満たせば表示対象とする
    const anyMatches = stArr.some(st=>{
      if(currentStatusFilter==='favorite' && !st.favorite) return false;
      if(currentStatusFilter==='owned' && !st.owned) return false;
      if(currentStatusFilter==='shiny' && !st.shiny) return false;
      if(currentStatusFilter==='home' && !st.home) return false;
      if(currentStatusFilter==='received' && !st.received) return false;
      if(currentStatusFilter==='card' && !st.hasCard) return false;
      return true;
    });
    if(currentStatusFilter!=='all' && !anyMatches) return false;
    if(searchQuery){
      const q = searchQuery;
      const hay = (e.nameJa+' '+e.commonNameJa).toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  }

  function renderList(){
    const listEl = $('#dist-list');
    if(!allEvents.length){
      listEl.innerHTML = '<div class="empty-note">配布データがまだ読み込まれていません。</div>';
      return;
    }
    const filtered = allEvents.filter(matchesFilters);
    $('#dist-count').textContent = `${filtered.length}件`;
    if(!filtered.length){
      listEl.innerHTML = '<div class="empty-note">条件に合う配布ポケモンが見つかりませんでした。</div>';
      return;
    }
    listEl.innerHTML = filtered.map(e=>buildItemHtml(e)).join('');
  }

  function buildItemHtml(e){
    let stArr = eventState[e.eventId] || [{}];
    if(!Array.isArray(stArr)) stArr = [stArr]; // 旧形式(単一オブジェクト)は配列化
    if(!stArr.length) stArr = [{}];
    const groupLabel = groupLabelFor(e.compatibleGames);
    const period = e.distributionPeriod && (e.distributionPeriod.start || e.distributionPeriod.end)
      ? `${e.distributionPeriod.start||'?'} 〜 ${e.distributionPeriod.end||'?'}`
      : (e.distributionYear ? `${e.distributionYear}年` : '時期不明');
    const detailHtml = `
        <div class="distDetail">
          <div class="distDetail-grid">
            <div class="row"><span class="k">配布地域</span><span class="v">${e.distributionRegion||'―'}</span></div>
            <div class="row"><span class="k">レベル</span><span class="v">${e.level ?? '―'}</span></div>
            <div class="row"><span class="k">ボール</span><span class="v">${e.ball||'―'}</span></div>
            <div class="row"><span class="k">特性</span><span class="v">${e.ability||'―'}</span></div>
            <div class="row"><span class="k">性格</span><span class="v">${e.nature||'―'}</span></div>
            <div class="row"><span class="k">持ち物</span><span class="v">${e.heldItem||'―'}</span></div>
            <div class="row"><span class="k">OT名</span><span class="v">${e.otName||'―'}</span></div>
            <div class="row"><span class="k">ID</span><span class="v">${e.otId||'―'}</span></div>
            <div class="row full"><span class="k">技</span><span class="v">${(e.moves&&e.moves.length)?e.moves.join(' / '):'―'}</span></div>
            <div class="row full"><span class="k">リボン</span><span class="v">${e.ribbon||'―'}</span></div>
          </div>
          <div class="distDetail-notes"><b>配布方法</b><br>${e.distributionMethod||'―'}${e.notes ? '<br><br><b>メモ</b><br>'+e.notes : ''}</div>
          ${(e.sourceUrl && e.sourceUrl.length) ? `<div class="distDetail-source">出典: ${e.sourceUrl.map(u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`).join('<br>')}</div>` : ''}
        </div>`;
    return stArr.map((st, i)=>{
      const idxLabel = (i>0) ? `<span class="indiv-idx-badge">${toCircledNumber(i+1)}</span>` : '';
      const deleteBtnHtml = (i>0) ? `<button class="indiv-delete-btn" title="この個体の枠を削除">🗑</button>` : '';
      const compatibleRoms = getCompatibleRoms(e.compatibleGames);
      const ownedRomIds = new Set(st.romIds || []);
      const romChipsHtml = compatibleRoms.length
        ? compatibleRoms.map(rom=>`<button class="rom-chip ${ownedRomIds.has(rom.romId)?'on':''}" data-rom-id="${escapeHtml(rom.romId)}">${escapeHtml(rom.name)}</button>`).join('')
        : `<span class="rom-chip-empty">対応ソフトが登録されていません</span>`;
      return `
      <div class="distItem" data-event-id="${e.eventId}" data-indiv-index="${i}">
        <div class="distRow">
          <div class="distName">${e.nameJa}${idxLabel}<span class="paren">${e.commonNameJa}</span></div>
          <div class="distGames">${groupLabel}｜${period}</div>
        </div>
        <div class="distIcons">
          <button class="iconBtn fav-btn ${st.favorite?'':'off'}" title="お気に入り">🩷</button>
          <button class="iconBtn status-btn ${st.owned?'':'off'}" title="所持">${st.owned?'✅':'➖'}</button>
          <button class="iconBtn shiny-btn ${st.shiny?'':'off'}" title="色違い">✨</button>
          <button class="iconBtn home-btn ${st.home?'':'off'}" title="HOME移送対象">🏠</button>
          <button class="iconBtn shifter-btn ${st.shifter?'':'off'}" title="BWへ移送">🏹</button>
          <button class="iconBtn mover-btn ${st.mover?'':'off'}" title="ポケムーバー通過">📤</button>
          <button class="iconBtn card-btn ${st.hasCard?'':'off'}" title="ふしぎなおくりものカードを保存しているか">💌</button>
          <button class="iconBtn received-btn ${st.received?'':'off'}" title="実際に受け取り済みか">🤝</button>
          <button class="indiv-add-btn" title="この配布ポケモンをもう1匹追加">+</button>
          ${deleteBtnHtml}
          <button class="expandBtn">👇</button>
        </div>
        <div class="rom-chip-row">${romChipsHtml}</div>
        ${detailHtml}
      </div>
    `;
    }).join('');
  }

  function toCircledNumber(n){
    const circled = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
    return circled[n-1] || `(${n})`;
  }

  async function saveState(){
    const ok = await idbSet('distributionState', eventState);
    dlog(`saveState完了: ok=${ok}`);
    return ok;
  }
  const saveStateDebounced = debounce(saveState, 400);

  // 配列形式(複数個体)のeventStateを安全に取得・更新するヘルパー
  function getEventStateArr(eventId){
    let arr = eventState[eventId];
    if(!arr) arr = [{}];
    if(!Array.isArray(arr)) arr = [arr];
    if(!arr.length) arr = [{}];
    return arr;
  }
  function updateIndivState(eventId, indivIndex, mutateFn){
    const arr = getEventStateArr(eventId);
    if(!arr[indivIndex]) arr[indivIndex] = {};
    mutateFn(arr[indivIndex]);
    eventState[eventId] = arr;
    return arr[indivIndex];
  }

  $('#dist-list').addEventListener('click', (e)=>{
    const item = e.target.closest('.distItem');
    if(!item) return;
    const eventId = item.dataset.eventId;
    const indivIndex = parseInt(item.dataset.indivIndex, 10) || 0;

    const favBtn = e.target.closest('.fav-btn');
    if(favBtn){
      const cur = updateIndivState(eventId, indivIndex, s=>{ s.favorite = !s.favorite; });
      favBtn.classList.toggle('off', !cur.favorite);
      saveStateDebounced();
      return;
    }
    const statusBtn = e.target.closest('.status-btn');
    if(statusBtn){
      const cur = updateIndivState(eventId, indivIndex, s=>{ s.owned = !s.owned; });
      statusBtn.classList.toggle('off', !cur.owned);
      statusBtn.textContent = cur.owned ? '✅' : '➖';
      saveStateDebounced();
      return;
    }
    const shinyBtn = e.target.closest('.shiny-btn');
    if(shinyBtn){
      const cur = updateIndivState(eventId, indivIndex, s=>{ s.shiny = !s.shiny; });
      shinyBtn.classList.toggle('off', !cur.shiny);
      saveStateDebounced();
      return;
    }
    const homeBtn = e.target.closest('.home-btn');
    if(homeBtn){
      const cur = updateIndivState(eventId, indivIndex, s=>{ s.home = !s.home; });
      homeBtn.classList.toggle('off', !cur.home);
      saveStateDebounced();
      return;
    }
    const shifterBtn = e.target.closest('.shifter-btn');
    if(shifterBtn){
      const cur = updateIndivState(eventId, indivIndex, s=>{ s.shifter = !s.shifter; });
      shifterBtn.classList.toggle('off', !cur.shifter);
      saveStateDebounced();
      return;
    }
    const moverBtn = e.target.closest('.mover-btn');
    if(moverBtn){
      const cur = updateIndivState(eventId, indivIndex, s=>{ s.mover = !s.mover; });
      moverBtn.classList.toggle('off', !cur.mover);
      saveStateDebounced();
      return;
    }
    const cardBtn = e.target.closest('.card-btn');
    if(cardBtn){
      const cur = updateIndivState(eventId, indivIndex, s=>{ s.hasCard = !s.hasCard; });
      cardBtn.classList.toggle('off', !cur.hasCard);
      saveStateDebounced();
      return;
    }
    const receivedBtn = e.target.closest('.received-btn');
    if(receivedBtn){
      const cur = updateIndivState(eventId, indivIndex, s=>{ s.received = !s.received; });
      receivedBtn.classList.toggle('off', !cur.received);
      saveStateDebounced();
      return;
    }
    const indivAddBtn = e.target.closest('.indiv-add-btn');
    if(indivAddBtn){
      const arr = getEventStateArr(eventId);
      arr.push({});
      eventState[eventId] = arr;
      saveStateDebounced();
      renderList(); // 個体数が変わったので該当種の行を再描画する
      return;
    }
    const indivDeleteBtn = e.target.closest('.indiv-delete-btn');
    if(indivDeleteBtn){
      const arr = getEventStateArr(eventId);
      if(indivIndex===0 || indivIndex>=arr.length) return; // ①番目は削除不可
      const ev = allEvents.find(ev=>ev.eventId===eventId);
      const label = toCircledNumber(indivIndex+1);
      if(confirm(`${ev ? ev.nameJa : 'この個体'}${label} の枠を削除しますか？\nこの操作は取り消せません。`)){
        arr.splice(indivIndex, 1);
        eventState[eventId] = arr;
        saveStateDebounced();
        renderList(); // 個体数が変わったので該当種の行を再描画する
      }
      return;
    }
    const romChip = e.target.closest('.rom-chip');
    if(romChip){
      const romId = romChip.dataset.romId;
      const cur = updateIndivState(eventId, indivIndex, s=>{
        if(!s.romIds) s.romIds = [];
        const idx = s.romIds.indexOf(romId);
        if(idx>=0) s.romIds.splice(idx,1); else s.romIds.push(romId);
      });
      romChip.classList.toggle('on', cur.romIds && cur.romIds.includes(romId));
      saveStateDebounced();
      return;
    }
    const expandBtn = e.target.closest('.expandBtn');
    if(expandBtn){
      item.classList.toggle('open');
      return;
    }
  });

  dlog('loadEvents呼び出し直前');
  // ===== 右端ミニスクロールバー =====
  (function setupMiniScrollbar(){
    const bar = $('#mini-scrollbar');
    const thumb = $('#mini-scrollbar-thumb');
    const badge = $('#mini-scrollbar-badge');
    const track = bar.querySelector('.mini-scrollbar-track');
    let dragging = false;
    let scrollingFadeTimer = null;

    function docHeightInfo(){
      const doc = document.documentElement;
      const scrollTop = window.scrollY || doc.scrollTop;
      const scrollHeight = doc.scrollHeight - doc.clientHeight;
      return { scrollTop, scrollHeight };
    }

    function currentVisibleName(){
      const items = $$('#dist-list .distItem');
      if(!items.length) return '';
      const targetY = window.scrollY + 90;
      let closest = items[0];
      for(const item of items){
        const rect = item.getBoundingClientRect();
        const top = rect.top + window.scrollY;
        if(top <= targetY) closest = item; else break;
      }
      const nameEl = closest.querySelector('.distName');
      return nameEl ? nameEl.textContent.trim() : '';
    }

    function updateThumb(){
      const { scrollTop, scrollHeight } = docHeightInfo();
      if(scrollHeight < 400){ bar.classList.remove('show'); return; }
      bar.classList.add('show');
      const trackRect = track.getBoundingClientRect();
      const trackHeight = trackRect.height;
      const ratio = Math.min(1, Math.max(0, scrollTop / scrollHeight));
      const thumbHeight = thumb.offsetHeight;
      const top = trackRect.top + ratio * (trackHeight - thumbHeight);
      thumb.style.top = top + 'px';
      badge.style.top = (top + thumbHeight/2) + 'px';
    }

    function showWhileScrolling(){
      bar.classList.add('scrolling');
      clearTimeout(scrollingFadeTimer);
      scrollingFadeTimer = setTimeout(()=>{
        if(!dragging) bar.classList.remove('scrolling');
      }, 900);
    }

    function scrollToRatio(clientY){
      const trackRect = track.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientY - trackRect.top) / trackRect.height));
      const { scrollHeight } = docHeightInfo();
      window.scrollTo(0, ratio * scrollHeight);
      updateThumb();
      badge.textContent = currentVisibleName();
    }

    function startDrag(clientY){
      dragging = true;
      bar.classList.add('dragging');
      bar.classList.add('scrolling');
      clearTimeout(scrollingFadeTimer);
      scrollToRatio(clientY);
    }
    function endDrag(){
      dragging = false;
      bar.classList.remove('dragging');
      showWhileScrolling();
    }

    thumb.addEventListener('touchstart', e=>{
      startDrag(e.touches[0].clientY);
      e.preventDefault();
    }, {passive:false});
    thumb.addEventListener('touchmove', e=>{
      if(!dragging) return;
      scrollToRatio(e.touches[0].clientY);
      e.preventDefault();
    }, {passive:false});
    thumb.addEventListener('touchend', endDrag);
    thumb.addEventListener('touchcancel', endDrag);

    thumb.addEventListener('mousedown', e=>{ startDrag(e.clientY); });
    window.addEventListener('mousemove', e=>{ if(dragging) scrollToRatio(e.clientY); });
    window.addEventListener('mouseup', endDrag);

    window.addEventListener('scroll', ()=>{
      if(!dragging){
        updateThumb();
        showWhileScrolling();
      }
    }, {passive:true});
    window.addEventListener('resize', updateThumb);

    // 一覧の再描画のたびに再計算(renderListをラップする)
    const origRenderList = renderList;
    renderList = function(...args){
      const result = origRenderList.apply(this, args);
      setTimeout(updateThumb, 50);
      return result;
    };

    updateThumb();
  })();

  // ===== テーマ復元 =====
  (async ()=>{
    const theme = await idbGet('theme');
    if(theme) document.documentElement.setAttribute('data-theme', theme);
  })();

  loadEvents();

  function settleWithin(promise, timeoutMs, label){
    return Promise.race([
      Promise.resolve(promise).then(value=>({status:'fulfilled', value}), error=>({status:'rejected', error})),
      new Promise(resolve=>setTimeout(()=>resolve({status:'timeout'}), timeoutMs))
    ]).then(result=>{
      if(result.status==='timeout') dlog(`${label}: ${timeoutMs}msで待機打ち切り`);
      else if(result.status==='rejected') dlog(`${label}: 例外 ${result.error && result.error.message}`);
      return result;
    });
  }

  window.addEventListener('pagehide', ()=>{
    dlog('pagehide → 新規保存は開始せずDB接続のみ閉じる');
    closeDbConnection();
  });

  const backLink = $('#back-to-index');
  if(backLink){
    backLink.addEventListener('click', async (e)=>{
      e.preventDefault();
      if(backLink.dataset.navigating==='1') return;
      backLink.dataset.navigating='1';
      dlog('戻るリンククリック: 保存を試してから遷移');
      const hardFallback = setTimeout(()=>{ location.href = 'index.html'; }, 1200);
      try{
        await settleWithin(saveState(), 900, 'saveState');
      }finally{
        clearTimeout(hardFallback);
        dlog('戻るリンク: index.htmlへ遷移実行');
        location.href = 'index.html';
      }
    });
  }
})();
</script>
